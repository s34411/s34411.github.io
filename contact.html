<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .contact-center {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contact-center h1 {
            margin-bottom: 35px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }

        .contact-list a {
            display: block;
            padding: 15px;
            border: 1px solid #25345d;
            border-radius: 30px;
            text-decoration: none;
            color: #25345d;
            background: white;
            transition: 0.3s;
        }

        .contact-list a:hover {
            background: #25345d;
            color: white;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">My Portfolio</div>

        <div class="nav-menu">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="contact.html" class="active">CONTACT</a>
        </div>
    </nav>


    <!-- CONTACT -->
    <section class="contact-center">

        <h1>Contact Me</h1>

        <div class="contact-list">

            <a href="https://www.instagram.com/ใส่ไอจีตรงนี้/"
               target="_blank">
                Instagram
            </a>

            <a href="https://line.me/ti/p/~ใส่ไลน์ตรงนี้"
               target="_blank">
                LINE
            </a>

            <a href="https://github.com/ใส่ชื่อ-githubตรงนี้"
               target="_blank">
                GitHub
            </a>

            <a href="https://www.facebook.com/ใส่เฟซบุ๊กตรงนี้"
               target="_blank">
                Facebook
            </a>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
