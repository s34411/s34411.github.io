<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | My Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .contact-center {
            min-height: 72vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* หัวข้อ */
        .contact-title {
            position: relative;
            margin-bottom: 40px;
        }

        .contact-small {
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 8px;
            opacity: 0.7;
        }

        .contact-title h1 {
            font-family: Georgia, serif;
            font-size: 52px;
            margin: 0;
        }

        /* กล่องรวม */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 330px;
            position: relative;
            z-index: 2;
        }

        /* ปุ่ม */
        .contact-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 17px 22px;

            border: 1px solid #25345d;
            border-radius: 4px;

            text-decoration: none;
            color: #25345d;
            background: #fffdf8;

            font-size: 15px;
            letter-spacing: 1px;

            box-shadow: 5px 5px 0px #d9e3f2;

            transition: 0.3s ease;
        }

        .contact-list a span {
            font-size: 12px;
            opacity: 0.6;
        }

        .contact-list a:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px #25345d;
            background: #eef4fb;
        }

        /* ของตกแต่ง */
        .contact-star {
            position: absolute;
            top: 18%;
            left: 25%;
            font-size: 28px;
            transform: rotate(-15deg);
        }

        .contact-heart {
            position: absolute;
            right: 25%;
            bottom: 20%;
            font-size: 25px;
            transform: rotate(15deg);
        }

        .contact-line {
            position: absolute;
            width: 120px;
            height: 1px;
            background: #25345d;
            opacity: 0.25;
            top: 24%;
            right: 20%;
            transform: rotate(-12deg);
        }

        @media (max-width: 750px) {

            .contact-title h1 {
                font-size: 42px;
            }

            .contact-list {
                width: 85%;
                max-width: 330px;
            }

            .contact-star {
                left: 10%;
            }

            .contact-heart {
                right: 10%;
            }

            .contact-line {
                right: 5%;
            }
        }
    </style>
</head>

<body>

        </div>

    <!-- CONTACT -->

            </div>

        </div>

               rel="noopener noreferrer">

                <strong>Facebook</strong>

                <span>↗</span>

            </a>

    </section>


    <!-- FOOTER -->

</body>
</html>
