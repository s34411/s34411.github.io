<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | My Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav class="navbar">

    <a href="index.html" class="logo">
        My Portfolio
    </a>

    <ul class="nav-menu">

        <li>
            <a href="index.html">
                HOME
            </a>
        </li>

        <li>
            <a href="about.html">
                ABOUT
            </a>
        </li>

        <li>
            <a href="portfolio.html">
                PORTFOLIO
            </a>
        </li>

        <li>
            <a href="contact.html" class="active">
                CONTACT
            </a>
        </li>

    </ul>

</nav>


<main class="container">


    <header class="page-header">

        <h1>
            Contact Me
        </h1>

        <p>
            Let's connect!
        </p>

    </header>


    <section class="contact-box">


        <div class="contact-content">

            <small>
                GET IN TOUCH
            </small>

            <h2>
                Let's talk.
            </h2>

            <p>
                หากสนใจผลงาน หรือต้องการพูดคุย
                สามารถติดต่อผ่านช่องทาง
                ด้านล่างได้เลย
            </p>


            <div class="contact-item">

                <strong>
                    EMAIL
                </strong>

                <p>
                    your@email.com
                </p>

            </div>


            <div class="contact-item">

                <strong>
                    INSTAGRAM
                </strong>

                <p>
                    @yourusername
                </p>

            </div>


            <div class="contact-item">

                <strong>
                    LINE
                </strong>

                <p>
                    yourline
                </p>

            </div>

        </div>


        <div class="contact-form">

            <form
                action="mailto:your@email.com"
                method="post"
                enctype="text/plain"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    required
                >

                <textarea
                    name="message"
                    placeholder="Your Message"
                    required
                ></textarea>

                <button type="submit">
                    SEND MESSAGE
                </button>

            </form>

        </div>


    </section>


    <div class="page-nav">

        <a href="portfolio.html">
            ← PORTFOLIO
        </a>

        <a href="index.html">
            HOME →
        </a>

    </div>


</main>


<footer>
    © 2026 My Portfolio ♡
</footer>


</body>
</html>
